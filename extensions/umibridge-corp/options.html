<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>UmiBridge</title><link rel="stylesheet" href="options.css"><script defer src="options.js"></script></head>
<body><main><h1>Connect UmiBridge</h1><p>Create a pairing code in UmiBridge → Corp → Connection.</p>
<form id="connect"><label>Local address<input id="endpoint" type="url" value="http://127.0.0.1:43127" required></label><label>Pairing code<input id="token" type="password" required autocomplete="off"></label><button type="submit">Connect</button><button type="button" id="disconnect">Disconnect</button></form>
<p id="status" role="status">Not connected</p><h2>Chrome control</h2><p>Read pages, click, type, scroll, capture and manage tabs through your paired UmiBridge connection.</p><button id="browser-toggle" type="button" aria-pressed="false">Enable browser control</button><p id="browser-status" role="status"></p></main></body></html>
