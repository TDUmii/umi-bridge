<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Văn phòng - UmiBridge Corp</title>
  <link rel="stylesheet" href="office.css">
  <script defer src="office-model.js"></script>
  <script defer src="office-life.js"></script>
  <script defer src="office.js"></script>
  <script defer src="/admin/i18n.js"></script>
</head>
<body>
  <header>
    <div class="office-heading"><h1>Văn phòng</h1><div id="connection" role="status" hidden><span class="dot"></span><span id="health"></span></div></div>
    <div class="view-tools" aria-label="Hiển thị văn phòng">
      <button id="zoom-out" type="button" aria-label="Thu nhỏ văn phòng">−</button>
      <output id="zoom-value" aria-live="polite">100%</output>
      <button id="zoom-in" type="button" aria-label="Phóng to văn phòng">+</button>
      <button id="zoom-fit" type="button">Vừa khung</button>
      <button id="expand" type="button" aria-pressed="false">Mở rộng</button>
      <button id="motion" type="button" aria-pressed="false">Giảm chuyển động</button>
      <button id="ambient" type="button" aria-pressed="true">Sinh hoạt: Bật</button>
      <button id="room-plan" type="button" aria-pressed="false">Sơ đồ phòng</button>
      <button id="toggle-roster" type="button" aria-expanded="false" aria-controls="office-roster">Thông tin</button>
      <button id="info-settings-toggle" type="button" aria-expanded="false" aria-controls="info-settings">Chọn thông tin</button>
    </div>
  </header>
  <div id="info-settings" class="info-settings" hidden aria-label="Chọn thông tin hiển thị"><strong>Thông tin hiển thị</strong><label><input type="checkbox" data-info="team" checked> Đội ngũ</label><label><input type="checkbox" data-info="conversation" checked> Trao đổi</label><label><input type="checkbox" data-info="customers"> Khách</label><label><input type="checkbox" data-info="handoffs" checked> Bàn giao</label></div>
  <main>
    <section class="office" aria-label="Văn phòng pixel">
      <div class="scene" id="scene" tabindex="0" aria-label="Văn phòng. Trỏ hoặc dùng Tab vào nhân viên để xem tên, vai trò và nhiệm vụ."><div id="stage" hidden><canvas id="room" aria-label="Nhân viên và bàn làm việc."></canvas><div id="seat-labels" aria-label="Nhân viên tại bàn làm việc"></div></div>
        <div id="empty"><h2>Văn phòng đang chờ đủ đội ngũ</h2><p id="empty-message">Đang nhận danh sách nhân sự từ Corp.</p></div>
      </div>
      <div id="customer-line" class="customer-line" role="list" aria-label="Tên khách hàng đang chờ" hidden></div>
    </section>
    <aside id="office-roster" aria-label="Đội ngũ và nhiệm vụ">
      <section class="conversation-section" aria-label="Nội dung bàn giao"><h2>Trao đổi công việc</h2><div id="conversation" aria-live="polite"><p class="conversation-empty">Chưa có nội dung bàn giao được ghi nhận.</p></div></section>
      <div id="office-tabs" role="tablist" aria-label="Thông tin văn phòng"><button id="tab-team" role="tab" aria-selected="true" aria-controls="panel-team" data-office-tab="team">Thông tin</button><button id="tab-customers" role="tab" aria-selected="false" aria-controls="panel-customers" data-office-tab="customers">Khách</button><button id="tab-handoffs" role="tab" aria-selected="false" aria-controls="panel-handoffs" data-office-tab="handoffs">Bàn giao</button></div>
      <div id="panel-team" role="tabpanel" aria-labelledby="tab-team" data-office-panel="team">
      <div class="roster-title"><h2>Đội ngũ</h2><span id="count">0</span></div>
      <div id="roster" aria-label="Chọn nhân viên"></div>
      <section id="detail" hidden aria-label="Nhiệm vụ của nhân viên">
        <p id="detail-status" class="status"></p><h2 id="detail-role"></h2>
        <p id="detail-task"></p><p id="detail-count"></p>
        <button id="open-chat" type="button">Mở chat</button>
      </section>
      </div>
      <section id="panel-customers" role="tabpanel" aria-labelledby="tab-customers" data-office-panel="customers" class="customers" hidden><div class="roster-title"><h2>Khách đang chờ</h2><span id="customer-count">0</span></div><ol id="customers"></ol></section>
      <div id="panel-handoffs" role="tabpanel" aria-labelledby="tab-handoffs" data-office-panel="handoffs" class="handoff" hidden><h2>Bàn giao gần đây</h2><p id="handoff-empty">Chưa có bàn giao trong Project này.</p><ol id="handoffs"></ol></div>
    </aside>
  </main>
  <div id="employee-tooltip" role="tooltip" hidden><div class="tooltip-name"><i class="status-dot" id="tooltip-dot" aria-hidden="true"></i><strong id="tooltip-name"></strong></div><span id="tooltip-status"></span><small id="tooltip-department"></small><p id="tooltip-task"></p></div>
  <div id="zone-tooltip" role="tooltip" hidden></div>
</body>
</html>
